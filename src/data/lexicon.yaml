# ============================================================================
# src/data/lexicon.yaml
#
# Seed lexicon for the description -> tags/category engine.
#
# - Human-editable and version-controlled.
# - Loaded locally at startup. No network calls.
# - Adding a word/alias is a DATA edit, not a code change.
# - Future: a free LLM can propose additions offline; a human reviews and
#   commits them here. Never called at runtime.
#
# Canonical keys are lowercase slugs. `aliases` are matched after normalizing
# the description (lowercase, punctuation stripped, simple plural handling).
# ============================================================================

version: 1
updated: "2026-11-09"

description: >
  Seed items, merchants, services, channels and category rules. Grow this list
  as new stores, foods and regional words appear.

settings:
  max_tags_per_entry: 8
  auto_add_parent_tags: true
  fuzzy_match: true
  fuzzy_min_score: 85
  case_sensitive: false
  fallback_category: Groceries

# ----------------------------------------------------------------------------
# Channel tags: how the purchase happened.
# ----------------------------------------------------------------------------
channels:
  online:
    aliases:
      - online
      - app
      - website
      - web
      - online order
      - delivery app
      - ordered online
  instore:
    aliases:
      - instore
      - in-store
      - in store
      - shop
      - store
      - market
      - mall
      - kirana
      - counter
      - walked in

# ----------------------------------------------------------------------------
# Payment method tags: how the payment was made. These are tags, not accounts.
# UPI debits the linked bank account directly; only use a `wallet` account if
# it holds a stored balance.
# ----------------------------------------------------------------------------
methods:
  upi:
    aliases:
      - upi
      - gpay
      - google pay
      - phonepe
      - paytm
      - bhim
  netbanking:
    aliases:
      - netbanking
      - net banking
      - neft
      - imps
      - rtgs
      - bank transfer
  auto_debit:
    aliases:
      - auto debit
      - autodebit
      - mandate
      - standing instruction
      - ecs
  cheque:
    aliases:
      - cheque
      - check
  cash:
    aliases:
      - cash
      - cod
      - cash on delivery
  card:
    aliases:
      - card
      - credit card
      - debit card
      - swiped
      - pos
  wallet:
    aliases:
      - wallet
      - paytm wallet
      - amazon pay balance
      - phonepe wallet

# ----------------------------------------------------------------------------
# Service tags: used when one merchant has multiple businesses.
# Each service carries its own channel and default category.
# ----------------------------------------------------------------------------
services:
  instamart:
    display_name: Instamart
    aliases:
      - instamart
      - insta mart
      - swiggy instamart
    channel: online
    category: Groceries
  dineout:
    display_name: Dineout
    aliases:
      - dineout
      - dine out
      - swiggy dineout
      - dining out
      - restaurant booking
      - table booking
    channel: instore
    category: Dining Out
  food_delivery:
    display_name: Food delivery
    aliases:
      - delivery
      - food delivery
      - order food
      - dinner
      - lunch
      - breakfast
      - food
    channel: online
    category: Dining Out

