# ----------------------------------------------------------------------------
# Merchant tags: where it was bought.
# `category_services` maps a suggested category to a service, used when there
# is no explicit service keyword (e.g. apples + swiggy -> Instamart).
# ----------------------------------------------------------------------------
merchants:
  blinkit:
    display_name: Blinkit
    aliases:
      - blinkit
      - blink it
      - blinkit app
    default_channel: online
    default_category: Groceries
  swiggy:
    display_name: Swiggy
    aliases:
      - swiggy
      - swiggy app
    default_channel: online
    default_category: Dining Out
    default_service: food_delivery
    category_services:
      Groceries: instamart
    service_priority:
      - dineout
      - food_delivery
      - instamart
  star_market:
    display_name: Star Market
    aliases:
      - star market
      - starmarket
      - star market store
      - start market
    default_channel: instore
    default_category: Groceries
  zepto:
    display_name: Zepto
    aliases:
      - zepto
      - zepto app
    default_channel: online
    default_category: Groceries
  bigbasket:
    display_name: BigBasket
    aliases:
      - bigbasket
      - big basket
    default_channel: online
    default_category: Groceries
  dmart:
    display_name: DMart
    aliases:
      - dmart
      - d-mart
      - d mart
    default_channel: instore
    default_category: Groceries
  local_market:
    display_name: Local market
    aliases:
      - local market
      - mandi
      - sabzi mandi
      - vegetable market
    default_channel: instore
    default_category: Groceries
  amazon:
    display_name: Amazon
    aliases:
      - amazon
      - amazon app
      - amazon india
    default_channel: online
    default_category: Shopping
  flipkart:
    display_name: Flipkart
    aliases:
      - flipkart
      - flipkart app
    default_channel: online
    default_category: Shopping

# ----------------------------------------------------------------------------
# Fallback category rules. The first matching rule wins unless an item has a
# more specific category. Keep the item-specific categories in `items`.
# ----------------------------------------------------------------------------
category_rules:
  - any_tags:
      - fruits
      - apples
      - bananas
      - mangoes
      - oranges
      - veggies
      - bhindi
      - potatoes
      - onions
      - tomatoes
      - spinach
      - carrots
      - milk
      - curd
      - paneer
      - butter
      - cheese
      - bread
      - eggs
      - chicken
      - fish
      - mutton
      - rice
      - atta
      - oil
      - sugar
      - salt
      - tea
    category: Groceries
  - any_tags:
      - pizza
      - burger
      - sandwich
      - coffee
    category: Dining Out
  - any_tags:
      - petrol
    category: Transport
  - any_tags:
      - instamart
    category: Groceries
  - any_tags:
      - dineout
      - food_delivery
    category: Dining Out

# ----------------------------------------------------------------------------
# Optional quantity/unit hints for future parsing ("2 kg apples", "1 l milk").
# Not used for tags in v1; reserved for quantity analytics later.
# ----------------------------------------------------------------------------
units:
  kg:
    aliases: [kg, kgs, kilogram, kilograms, kilo]
  g:
    aliases: [g, gm, gms, gram, grams]
  l:
    aliases: [l, litre, liter, liters, litres]
  ml:
    aliases: [ml, milliliter, millilitre]
  dozen:
    aliases: [dozen, dz]
  piece:
    aliases: [piece, pieces, pc, pcs, pkt, packet]
